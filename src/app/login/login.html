<main class="login-page">
  <section class="login-card">
    <div class="brand">PC2 · Base de Datos II</div>
    <h1>Iniciar sesión</h1>
    <p>Accede al sistema de inventario</p>
    <form (ngSubmit)="submit()">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="username" placeholder="admin@inventario.com" />
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" [(ngModel)]="password" required autocomplete="current-password" placeholder="Ingresa tu contraseña" />
      @if (error()) { <div class="error" role="alert">{{ error() }}</div> }
      <button type="submit" [disabled]="loading() || !email || !password">{{ loading() ? 'Validando...' : 'Ingresar' }}</button>
    </form>
    <small>Autenticación segura mediante Supabase Auth</small>
  </section>
</main>
